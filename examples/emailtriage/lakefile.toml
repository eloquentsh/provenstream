name = "emailtriage"
version = "0.1.0"
defaultTargets = ["EmailTriage", "emailtriage-engine"]

# The core, by path: this example lives in the provenstream repository. A layer project of its own requires it by git
# URL and commit instead (see `provenstream init`).
[[require]]
name = "provenstream"
path = "../.."

# The email triage layer: it imports `Provenstream.Interface` and nothing else of the core.
[[lean_lib]]
name = "EmailTriage"

# The revision the engine is built from (written before the build; not in git).
[[lean_lib]]
name = "EmailTriageRevision"

[[lean_exe]]
name = "emailtriage-engine"
root = "EmailTriageMain"
